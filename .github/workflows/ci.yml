name: Self-hosting phase 6 acceptance
on:
  push:
    branches: [main, single-tenant-self-hosting]
  pull_request:
    branches: [main, single-tenant-self-hosting, codex/setup-auth, codex/social-recovery, codex/images-attachments, codex/ai-foundations, codex/content-ai, codex/durable-search, codex/background-insights, codex/ai-onboarding]
permissions:
  contents: read
jobs:
  foundations:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w feedbackland-react
      - run: npm run typecheck
      - run: npm run build
      - name: Build exact checkout with dotenv decoys
        run: |
          printf 'P01_BUILD_DECOY=must-never-ship\n' > .env
          printf 'P01_BUILD_DECOY=must-never-ship\n' > .env.production
          docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" --tag feedbackland:ci .
          rm .env .env.production
      - name: Build pinned Linux verification runner
        timeout-minutes: 8
        run: docker build -f ci/phase-six-runner.Dockerfile --tag feedbackland:phase-six-runner .
      - name: Run the cumulative gate on Chromium, Firefox, and WebKit
        run: |
          set -euo pipefail
          phase_six_tmp="$(mktemp -d "$RUNNER_TEMP/phase-six.XXXXXXXX")"
          # The harness publishes its disposable relays on the Linux runner's
          # loopback and passes absolute bind paths to the runner's Docker engine.
          docker run --rm --init --network host --ipc host \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE" \
            --mount "type=bind,src=$phase_six_tmp,dst=$phase_six_tmp" \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --workdir "$GITHUB_WORKSPACE" --env "TMPDIR=$phase_six_tmp" \
            --env "NPM_CONFIG_CACHE=$phase_six_tmp/npm" \
            --env SOURCE_COMMIT --env CI --env GITHUB_ACTIONS \
            --env NEXT_TELEMETRY_DISABLED \
            feedbackland:phase-six-runner bash -euc '
              node -e "if (require(\"playwright/package.json\").version !== \"1.64.1\") process.exit(1)"
              npm run verify -- --phase 6 --image feedbackland:ci --artifacts artifacts/self-hosting
            '
      - name: Inspect evidence for fixture-only output
        id: evidence
        if: always()
        run: |
          node --input-type=module -e "import{existsSync,readdirSync,readFileSync,appendFileSync}from'node:fs';const p='artifacts/self-hosting';if(existsSync(p)){for(const d of readdirSync(p,{withFileTypes:true,recursive:true})){if(d.isFile()){const s=readFileSync(d.parentPath+'/'+d.name,'utf8');if(/PRIVATE KEY|AIza[0-9A-Za-z_-]{30,}|sk-or-v1-/.test(s))throw Error('evidence requires private review')}}appendFileSync(process.env.GITHUB_OUTPUT,'present=true\n')}else{console.log('No verification evidence was produced; inspect the earlier failing step.')}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' && steps.evidence.outputs.present == 'true' }}
        with:
          name: self-hosting-phase-6
          path: artifacts/self-hosting/
          retention-days: 14
  development-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w feedbackland-react
      - run: npm run identity
      - run: npx playwright install --with-deps chromium
      - name: Verify development boot on a disposable database and free ports
        run: node --import tsx scripts/e2e/dev-smoke.ts
      - name: Remove only this job's remaining development resources
        if: always()
        run: |
          # The harness normally cleans up in finally; cancellation cleanup is
          # restricted to this runner's generated phase-1 development projects.
          for project in $(docker compose ls --all --format json | node -e "let s='';process.stdin.on('data',b=>s+=b).on('end',()=>console.log(JSON.parse(s).map(x=>x.Name).filter(x=>/^p02-dev-[a-f0-9]{8}$/.test(x)).join(' ')))"); do
            docker compose -p "$project" -f compose.dev.yml down --volumes
          done
